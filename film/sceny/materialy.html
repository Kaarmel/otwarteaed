<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>materiały</title><link rel="stylesheet" href="ruch.css"><style>@font-face{font-family:A;font-weight:400;src:url(../../otwarteaed/fonts/atkinson-latin-400-normal.woff2)}@font-face{font-family:A;font-weight:400;src:url(../../otwarteaed/fonts/atkinson-latin-ext-400-normal.woff2);unicode-range:U+0100-02AF}@font-face{font-family:A;font-weight:700;src:url(../../otwarteaed/fonts/atkinson-latin-700-normal.woff2)}@font-face{font-family:A;font-weight:700;src:url(../../otwarteaed/fonts/atkinson-latin-ext-700-normal.woff2);unicode-range:U+0100-02AF}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:A,sans-serif;background:#0B3D91;color:#fff;-webkit-font-smoothing:antialiased}
.w{height:100%;padding:90px 120px;display:flex;flex-direction:column;justify-content:center}
</style></head><body style="background:#F2F4F7"><div class="w" style="background:#F2F4F7;color:#10213F;padding:64px 110px;justify-content:flex-start">
  <div class="wej" style="--d:.05s;font-size:30px;font-weight:700;color:#00753A">Kampania „otwarte AED”</div>

    <img class="pop" id="m5" style="--d:.85s;grid-column:1/4;width:760px;justify-self:center;margin-top:10px" src="../../kampania/dla_dysponentow/odznaka-jasna.png" alt="">

</div>
<style>.akc{scale:1.07;box-shadow:0 0 0 6px #00843D,0 24px 50px rgba(0,132,61,.35)!important;position:relative;z-index:2;border-radius:12px}#m1,#m2,#m3,#m4,#m5{transition:scale .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}</style>
