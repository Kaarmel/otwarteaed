# Automatyczna aktualizacja zbioru co 2 godziny: OpenStreetMap (Overpass), zasoby z dane.gov.pl, nowe adresy z PRG,
# potem wdrożenie otwarteaed.pl i gdzieaed.pl. Baza adresów i pliki z datą są przenoszone między przebiegami w pamięci podręcznej Actions.
name: Aktualizacja danych
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
concurrency:
  group: aktualizacja
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Przywróć stan poprzedniego przebiegu
        uses: actions/cache/restore@v4
        with:
          path: |
            baza/adresy_prg.json
            baza/identyfikatory.json
            wejscie/warszawa_aed.json
            otwarteaed/dane
          key: stan-${{ github.run_id }}
          restore-keys: stan-
      - name: Zapamiętaj ostatni wdrożony raport
        run: cp otwarteaed/dane/jakosc.json /tmp/poprzedni_jakosc.json
      - name: xmllint
        run: command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)
      - name: Warszawa przez serwer pośredniczący
        # API m.st. Warszawy odrzuca połączenia z serwerów GitHub, więc ruch idzie tunelem SSH przez serwer w Polsce.
        # Na serwerze nic się nie zmienia (tylko przekierowanie ruchu). Gdy się nie uda, zostaje ostatnia kopia danych.
        env:
          PROXY_SSH_KEY: ${{ secrets.PROXY_SSH_KEY }}
          PROXY_KNOWN_HOSTS: ${{ secrets.PROXY_KNOWN_HOSTS }}
          WARSZAWA_API_TOKEN: ${{ secrets.WARSZAWA_API_TOKEN }}
        run: |
          if [ -z "$PROXY_SSH_KEY" ] || [ -z "$WARSZAWA_API_TOKEN" ]; then echo "brak sekretów — pomijam"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROXY_SSH_KEY" > ~/.ssh/proxy && chmod 600 ~/.ssh/proxy
          printf '%s\n' "$PROXY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if ! ssh -i ~/.ssh/proxy -o BatchMode=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=20 -f -N -D 127.0.0.1:1081 eouser@46.60.21.253; then
            echo "::warning::serwer pośredniczący niedostępny — zostaje ostatnia kopia danych Warszawy"; rm -f ~/.ssh/proxy; exit 0
          fi
          if curl -sf --max-time 90 --socks5-hostname 127.0.0.1:1081 -X POST https://dane.um.warszawa.pl/api/action/get_scb_lokalizacja_defibrylatorow \
               -H "Authorization: $WARSZAWA_API_TOKEN" -H "Content-Type: application/json" --data '{}' -o /tmp/warszawa.json \
             && node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/warszawa.json','utf8')); const l=Array.isArray(j)?j:j.result; process.exit(Array.isArray(l)&&l.length>=100?0:1)"; then
            cp /tmp/warszawa.json wejscie/warszawa_aed.json; echo "Warszawa: pobrano przez serwer pośredniczący"
          else
            echo "::warning::Warszawa: pobranie nieudane — zostaje ostatnia kopia danych"
          fi
          pkill -f "127.0.0.1:1081" || true
          rm -f ~/.ssh/proxy
      - name: Zbierz dane
        run: node hub/zbierz.mjs
      - name: Walidacja i autonaprawa
        # Wynik musi przejść kontrolę (XSD portalu, MD5, spójność plików, brak spadku > 10%).
        # Jeśli nie przejdzie: przebudowa z ostatnich sprawdzonych plików wejściowych i druga kontrola.
        # Jeśli i ta nie przejdzie, krok kończy się błędem i nic nie jest wdrażane: strony zostają w ostatniej dobrej wersji.
        run: |
          if node hub/sprawdz.mjs --poprzedni /tmp/poprzedni_jakosc.json; then exit 0; fi
          echo "::warning::Wynik nie przeszedł kontroli — przebudowa z ostatnich sprawdzonych plików wejściowych"
          node hub/zbierz.mjs --offline
          node hub/sprawdz.mjs
      - name: Zbuduj strony
        run: sh skrypty/strony.sh
      - name: Wdróż na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 pages deploy dist/otwarteaed --project-name otwarteaed --branch main --commit-dirty=true
          npx -y wrangler@4 pages deploy dist/gdzieaed --project-name gdzieaed --branch main --commit-dirty=true
      - name: Zapisz stan (tylko po udanym wdrożeniu)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            baza/adresy_prg.json
            baza/identyfikatory.json
            otwarteaed/dane
          key: stan-${{ github.run_id }}
